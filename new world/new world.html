<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Botanical Walkthrough</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #050a0f; 
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            z-index: 100;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="info">BOTANICAL SECTOR // ENGAGED</div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        // Add deep atmospheric fog
        scene.fog = new THREE.FogExp2(0x051015, 0.035);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft base light
        scene.add(ambientLight);
        
        const cyanLight = new THREE.PointLight(0x00ffff, 2, 50);
        cyanLight.position.set(0, 5, 0);
        scene.add(cyanLight);

        // 3. Environment (Dark metallic floor)
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x051015, 
            roughness: 0.6, 
            metalness: 0.3 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 4. Create Planters, Foliage, and Displays
        const sceneObjects = [];

        function createTechPlanter(x, z) {
            const group = new THREE.Group();
            
            // High-tech Metallic Planter Base
            const baseGeo = new THREE.CylinderGeometry(1.2, 0.9, 1.5, 16);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.2 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.75;
            group.add(base);

            // Lush "Low-Poly" Plant Cluster
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x11cc44, roughness: 0.8 });
            for(let i = 0; i < 7; i++) {
                const leafGeo = new THREE.SphereGeometry(0.5 + Math.random() * 0.5, 7, 7);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                // Cluster them randomly around the top of the planter
                leaf.position.set((Math.random() - 0.5), 1.5 + Math.random(), (Math.random() - 0.5));
                group.add(leaf);
            }

            // Floating Holographic Display
            const displayGeo = new THREE.PlaneGeometry(1.5, 2);
            const displayMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.25, 
                side: THREE.DoubleSide, 
                wireframe: true 
            });
            const display = new THREE.Mesh(displayGeo, displayMat);
            display.position.set(x < 0 ? 1.5 : -1.5, 2.5, 0); // Offset depending on side of the path
            display.rotation.y = x < 0 ? Math.PI / 6 : -Math.PI / 6;
            group.add(display);

            group.position.set(x, 0, z);
            scene.add(group);
            sceneObjects.push({ group, display });
        }

        // Generate an avenue of planters
        for(let i = 0; i < 25; i++) {
            createTechPlanter(-6, -i * 8); // Left side
            createTechPlanter(6, -i * 8);  // Right side
        }

        // 5. Set starting camera position
        camera.position.set(0, 2, 5);

        // 6. Animation Loop (The Walkthrough)
        function animate() {
            requestAnimationFrame(animate);

            // Move camera forward slowly
            camera.position.z -= 0.06;
            
            // Loop the path seamlessly
            if (camera.position.z < -120) {
                camera.position.z = 5;
            }

            // Gently float the holograms up and down
            sceneObjects.forEach(obj => {
                obj.display.position.y = 2.5 + Math.sin(Date.now() * 0.002 + obj.group.position.z) * 0.2;
            });

            renderer.render(scene, camera);
        }
        
        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
