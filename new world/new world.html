<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Botanical World</title>
    <style>
        :root {
            --cyan: #00ffff;
            --light-green: #90ee90;
            --light-blue: #add8e6;
            --dark-bg: #050a0f;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Initial Overlay for Audio Permission */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: transparent;
            color: var(--light-green);
            border: 2px solid var(--light-green);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.4);
        }

        button:hover {
            background: var(--light-green);
            color: #000;
            box-shadow: 0 0 25px var(--light-green);
        }

        /* The 3D Container */
        #world-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1000px;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        /* Simulates walking forward by scaling up the background */
        .landscape {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            /* Using a high-res placeholder image of a vast, green landscape */
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: brightness(0.8) contrast(1.2) hue-rotate(-20deg) saturate(1.5);
            animation: walkForward 30s linear infinite alternate;
        }

        /* Glowing atmospheric fog */
        .fog {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.1), rgba(0, 255, 255, 0.2));
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* Flowing water at the bottom */
        .river {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 255, 0.4) 100%),
                        url('https://images.unsplash.com/photo-1533371452382-d45a9da51ad9?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            opacity: 0.8;
            filter: hue-rotate(90deg) brightness(1.5);
            transform-origin: bottom;
            transform: rotateX(60deg);
            animation: flowWater 15s linear infinite;
        }

        /* Floating bioluminescent spores */
        .spore {
            position: absolute;
            width: 4px; height: 4px;
            background-color: var(--light-green);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px var(--light-green);
            opacity: 0.8;
            animation: floatUp 10s ease-in-out infinite;
        }

        @keyframes walkForward {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.3) translateY(2%); }
        }

        @keyframes flowWater {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Initialize Environment</h1>
        <p>Audio is required for the full experience.</p>
        <button id="enter-btn">Enter the Biosphere</button>
    </div>

    <div id="world-container">
        <div class="landscape"></div>
        <div class="river"></div>
        <div class="fog"></div>
        </div>

    <audio id="water-sound" loop>
        <source src="https://actions.google.com/sounds/v1/water/river.ogg" type="audio/ogg">
    </audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const enterBtn = document.getElementById('enter-btn');
        const worldContainer = document.getElementById('world-container');
        const waterSound = document.getElementById('water-sound');

        // Generate floating glowing spores
        function createSpores() {
            for (let i = 0; i < 40; i++) {
                let spore = document.createElement('div');
                spore.classList.add('spore');
                spore.style.left = Math.random() * 100 + 'vw';
                spore.style.animationDuration = (Math.random() * 5 + 5) + 's';
                spore.style.animationDelay = Math.random() * 5 + 's';
                worldContainer.appendChild(spore);
            }
        }

        enterBtn.addEventListener('click', () => {
            // Hide start screen
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);

            // Fade in world
            worldContainer.style.opacity = '1';

            // Play audio
            waterSound.volume = 0.6;
            waterSound.play();

            // Spawn particles
            createSpores();
        });
    </script>
</body>
</html>
