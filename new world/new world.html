<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observation Deck v2</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
        }
        button {
            padding: 20px 50px; background: transparent; color: #0ff;
            border: 1px solid #0ff; cursor: pointer; text-transform: uppercase;
            letter-spacing: 4px; transition: 0.3s;
        }
        button:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        
        #ui-layer {
            position: absolute; bottom: 30px; left: 40px; color: rgba(0, 255, 255, 0.6);
            pointer-events: none; z-index: 100; text-transform: uppercase;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <button id="enter-btn">Engage Systems</button>
    </div>

    <div id="ui-layer">
        <h1>Observation Deck // Active</h1>
        <p>Nebula Link: Stabilized</p>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let cloud1, cloud2;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Basic Environment
            scene.fog = new THREE.FogExp2(0x050505, 0.02);
            camera.position.set(0, 4, 15);
            clock = new THREE.Clock();

            // Lighting
            const ambient = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambient);
            
            // Simple Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Nebula Cloud Setup
            const createNebula = (color, x, z) => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                grad.addColorStop(0, color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,256,256);
                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), mat);
                mesh.position.set(x, 10, z);
                return mesh;
            };

            cloud1 = createNebula('rgba(0, 255, 255, 0.3)', -20, -50);
            cloud2 = createNebula('rgba(255, 0, 100, 0.3)', 20, -60);
            scene.add(cloud1, cloud2);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            cloud1.rotation.z = time * 0.1;
            cloud2.rotation.z = -time * 0.1;
            renderer.render(scene, camera);
        }

        document.getElementById('enter-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            init();
        });

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
