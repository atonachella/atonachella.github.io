<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Holographic World</title>
    <style>
        :root {
            --core-red: #ff0000;
            --pure-white: #ffffff;
            --deep-black: #050505;
            --dark-red: #220000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--deep-black);
            font-family: 'Courier New', Courier, monospace;
            color: var(--pure-white);
        }

        /* Intro Screen */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-shadow: 0 0 15px var(--core-red);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--pure-white);
            text-shadow: 0 0 10px var(--core-red), 0 0 20px var(--core-red);
            margin-bottom: 40px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: rgba(255, 0, 0, 0.1);
            color: var(--pure-white);
            border: 2px solid var(--core-red);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3), inset 0 0 10px rgba(255, 0, 0, 0.2);
        }

        button:hover {
            background: var(--core-red);
            color: var(--deep-black);
            box-shadow: 0 0 30px var(--core-red), inset 0 0 20px var(--pure-white);
        }

        /* 3D World Setup */
        #world-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1000px;
            opacity: 0;
            transition: opacity 2s ease-in;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Vast Technoscape Floor Grid */
        .tech-floor {
            position: absolute;
            bottom: -30%;
            width: 200vw;
            height: 150vh;
            background:
                linear-gradient(transparent 95%, var(--core-red) 100%),
                linear-gradient(90deg, transparent 95%, var(--core-red) 100%);
            background-size: 60px 60px;
            transform: rotateX(80deg);
            transform-origin: bottom;
            animation: gridMove 4s linear infinite;
            box-shadow: inset 0 0 150px var(--deep-black);
        }

        /* Deep atmospheric background */
        .atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, var(--dark-red) 0%, var(--deep-black) 60%);
            z-index: -1;
        }

        /* Gravity Defying Modules */
        .module {
            position: absolute;
            width: 140px;
            height: 180px;
            border: 1px solid var(--pure-white);
            background: rgba(255, 0, 0, 0.05);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .module::before {
            content: '';
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: translateZ(-30px);
        }

        /* Holographic Projections inside Modules */
        .hologram {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--pure-white);
            border-radius: 50%;
            animation: spin 6s linear infinite;
            box-shadow: 0 0 20px var(--core-red);
        }

        .hologram-inner {
            width: 100%;
            height: 100%;
            border: 1px solid var(--core-red);
            transform: rotateX(60deg) rotateY(45deg);
            animation: spinReverse 4s linear infinite;
        }

        /* Positioning and floating animations for modules */
        .mod-1 { left: 15%; top: 20%; animation: float 6s ease-in-out infinite; }
        .mod-2 { right: 15%; top: 35%; animation: float 7s ease-in-out infinite 1s; }
        .mod-3 { left: 35%; top: 10%; animation: float 8s ease-in-out infinite 2s; transform: scale(0.6); }
        .mod-4 { right: 35%; top: 15%; animation: float 5s ease-in-out infinite 0.5s; transform: scale(1.3); }

        /* Intelligent Lighting Beams */
        .light-beam {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 120vh;
            background: linear-gradient(to top, var(--core-red), transparent);
            opacity: 0.4;
            animation: sweep 12s ease-in-out infinite alternate;
            transform-origin: bottom;
        }
        .beam-1 { left: 25%; animation-delay: 0s; }
        .beam-2 { right: 30%; animation-delay: -4s; }

        /* Keyframe Animations */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-50px) rotateY(15deg); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            100% { transform: rotateX(60deg) rotateY(45deg) rotate(-360deg); }
        }
        @keyframes sweep {
            0% { transform: rotate(-25deg) scaleY(0.8); opacity: 0.1; }
            100% { transform: rotate(25deg) scaleY(1.3); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Initialize Grid</h1>
        <button id="enter-btn">Engage Systems</button>
    </div>

    <div id="world-container">
        <div class="atmosphere"></div>
        
        <div class="tech-floor"></div>

        <div class="light-beam beam-1"></div>
        <div class="light-beam beam-2"></div>

        <div class="module mod-1">
            <div class="hologram"><div class="hologram-inner"></div></div>
        </div>
        <div class="module mod-2">
            <div class="hologram"><div class="hologram-inner"></div></div>
        </div>
        <div class="module mod-3">
            <div class="hologram"><div class="hologram-inner"></div></div>
        </div>
        <div class="module mod-4">
            <div class="hologram"><div class="hologram-inner"></div></div>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const enterBtn = document.getElementById('enter-btn');
        const worldContainer = document.getElementById('world-container');

        enterBtn.addEventListener('click', () => {
            // Fade out intro
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);

            // Fade in futuristic world
            worldContainer.style.opacity = '1';
        });
    </script>
</body>
</html>
