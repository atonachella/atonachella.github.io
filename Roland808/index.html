<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual 16-Pad MIDI Drum Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="drum-machine-container">
        <header>
            <h1>MPC-16 Digital Interface</h1>
            <div class="midi-status" id="midi-status">MIDI: Disconnected</div>
        </header>

        <div class="pad-grid" id="pad-grid">
            </div>

        <div class="controls">
            <p>Press keys <b>1-4, Q-R, A-F, Z-V</b> on your keyboard to play, or connect a MIDI controller.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
