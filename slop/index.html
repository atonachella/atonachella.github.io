<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screensaver</title>
    <style>
        /* Forces the container to be the absolute size of the screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* Change color here */
            cursor: none; /* Hides cursor while active */
        }
        
        #content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="content">
        <h1>Screensaver Active</h1>
    </div>

    <script>
        // 1. Force Fullscreen on load (requires user interaction)
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            }
        }

        // 2. Trigger fullscreen on first click
        document.addEventListener('click', goFullscreen, { once: true });

        // 3. Exit logic: Close window on mouse move or key press
        function exitApp() {
            window.close();
        }

        document.addEventListener('mousemove', exitApp);
        document.addEventListener('keydown', exitApp);
        document.addEventListener('mousedown', exitApp);
    </script>
</body>
</html>
