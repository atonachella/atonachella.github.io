<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CYAN FALCON — realm preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div class="topline">cyan falcon <span>&mdash;</span> realm preview</div>
  <div class="hint">drag to look, full 360 &bull; click a planet to approach, click again to enter</div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
  <div class="reticle"></div>
  <div id="confirm" class="confirm"></div>
  <div class="status"><span class="live">&#9679;</span> proof of concept &mdash; nav feel only</div>
  <div id="labels"></div>
</div>
<div class="scan"></div>

<div id="interior" class="interior">
  <div class="interior-inner">
    <div id="interior-tag" class="interior-tag"></div>
    <div class="interior-sub">this is a placeholder &mdash; real content goes here next</div>
    <div id="interior-exit" class="interior-exit">&larr; back to the void</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
