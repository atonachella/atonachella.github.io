<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITAL SPECTRUM // 3D planetary audio visualizer</title>
<style>
  :root{
    --void:#03040a;
    --panel-edge:#1c2440;
    --lcd:#ffb000;
    --lcd-dim:#7a5400;
    --cyan:#6fe3e0;
    --screw:#2a3050;
    --text:#c9d3f0;
    --text-dim:#5c6690;
    --font-display:'Orbitron', sans-serif;
    --font-body:'Rajdhani', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:var(--font-body);
    color:var(--text);
    user-select:none;
  }
  #stage{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #scene-wrap{
    position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
    cursor:grab;
    transition:width .35s ease, height .35s ease, top .35s ease, right .35s ease, border-radius .35s ease, box-shadow .35s ease;
  }
  #scene-wrap:active{ cursor:grabbing; }
  canvas#scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #hint{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; font-family:var(--font-display); letter-spacing:0.12em;
    color:var(--text-dim); pointer-events:none; font-size:14px;
    text-shadow:0 0 12px rgba(111,227,224,0.25); transition:opacity .4s ease;
  }
  #hint span{ display:block; margin-top:8px; font-family:var(--font-body); font-size:12px; color:var(--text-dim); font-weight:500; }

  #console{
    flex:0 0 auto; position:relative;
    background:
      radial-gradient(circle at 8% 0%, rgba(111,227,224,0.06), transparent 40%),
      linear-gradient(180deg, #10152a 0%, #0a0e1c 60%, #070a14 100%);
    border-top:1px solid var(--panel-edge);
    box-shadow:0 -6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    padding:10px 14px 12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; z-index:5;
  }
  .screw{
    width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a5280, var(--screw) 60%, #05070f 100%);
    box-shadow:0 1px 1px rgba(0,0,0,0.6), 0 0 0 1px #05070f; position:absolute;
  }
  .screw.tl{ top:6px; left:6px; } .screw.tr{ top:6px; right:6px; }
  .screw.bl{ bottom:6px; left:6px; } .screw.br{ bottom:6px; right:6px; }

  button.deck-btn{
    font-family:var(--font-display); font-size:11px; letter-spacing:0.08em;
    background:linear-gradient(180deg,#1a2140,#0e1226); color:var(--cyan);
    border:1px solid #2a3560; border-radius:6px; padding:8px 10px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 6px rgba(0,0,0,0.4);
    transition:transform .08s ease, box-shadow .15s ease, color .15s ease;
    display:flex; align-items:center; justify-content:center; min-width:38px; height:34px;
  }
  button.deck-btn:hover{ color:#fff; box-shadow:0 0 10px rgba(111,227,224,0.4), inset 0 1px 0 rgba(255,255,255,0.08); }
  button.deck-btn:active{ transform:translateY(1px) scale(0.97); }
  button.deck-btn.active{ color:#03040a; background:linear-gradient(180deg, var(--cyan), #2fb3b0); }

  #fileLabel{
    font-family:var(--font-display); font-size:10px; letter-spacing:0.1em; color:var(--lcd);
    border:1px solid #4a3a10; background:linear-gradient(180deg,#221806,#120c02);
    padding:8px 12px; border-radius:6px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05); white-space:nowrap;
  }
  #fileLabel:hover{ box-shadow:0 0 10px rgba(255,176,0,0.35); }
  #fileInput{ display:none; }

  #lcd{
    font-family:var(--font-display); background:#050702; border:1px solid #2a2410; border-radius:6px;
    padding:8px 12px; flex:1 1 260px; min-width:180px; color:var(--lcd);
    box-shadow:inset 0 0 10px rgba(0,0,0,0.8), inset 0 0 18px rgba(255,176,0,0.05);
    position:relative; overflow:hidden; height:34px; display:flex; align-items:center; gap:10px;
  }
  #lcd .beatled{
    width:8px; height:8px; border-radius:50%; background:var(--lcd-dim);
    box-shadow:0 0 2px rgba(0,0,0,0.8); flex:0 0 auto; transition:background .05s, box-shadow .05s;
  }
  #lcd .beatled.on{ background:#ffdb70; box-shadow:0 0 8px 2px #ffb000; }
  #trackName{ font-size:12px; letter-spacing:0.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; }
  #timeReadout{ font-size:11px; opacity:0.85; flex:0 0 auto; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--cyan), #223); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 60%);
    box-shadow:0 0 6px rgba(111,227,224,0.7); cursor:pointer;
  }
  #seek{ flex:1 1 160px; min-width:100px; }
  #volume{ width:70px; }
  .grp{ display:flex; align-items:center; gap:6px; }
  .lbl{ font-size:9px; letter-spacing:0.1em; color:var(--text-dim); font-family:var(--font-display); }

  #legend{
    position:absolute; top:14px; right:16px; font-family:var(--font-body); font-size:11px; color:var(--text-dim);
    background:rgba(6,9,20,0.55); border:1px solid var(--panel-edge); border-radius:8px; padding:10px 12px;
    line-height:1.6; backdrop-filter:blur(3px); transition:opacity .3s ease; z-index:4;
  }
  #legend .row{ display:flex; align-items:center; gap:8px; }
  #legend .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  #legend .hz{ margin-left:auto; opacity:0.6; font-size:10px; }
  #legend h4{ margin:0 0 6px; font-family:var(--font-display); font-size:10px; letter-spacing:0.12em; color:var(--cyan); font-weight:500;}

  #dragTip{
    position:absolute; bottom:12px; left:16px; font-size:10px; letter-spacing:0.08em;
    color:var(--text-dim); font-family:var(--font-display); opacity:0.55; z-index:4; pointer-events:none;
  }

  body.compact #scene-wrap{
    position:fixed; width:300px; height:220px; top:14px; right:14px; left:auto; bottom:auto;
    border-radius:10px; border:1px solid var(--panel-edge);
    box-shadow:0 10px 40px rgba(0,0,0,0.7), 0 0 0 1px #05070f, 0 0 24px rgba(111,227,224,0.08);
    flex:0 0 auto;
  }
  body.compact #console{ order:2; }
  body.compact #legend, body.compact #dragTip{ display:none; }
  body.compact #hint{ font-size:10px; }
</style>
</head>
<body>

<div id="stage">
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="hint">LOAD A TRACK TO BEGIN<span>bass rides the outer orbits &middot; treble rides the inner ones</span></div>
    <div id="dragTip">DRAG TO ORBIT &middot; SCROLL TO ZOOM</div>
    <div id="legend">
      <h4>FREQUENCY / ORBIT MAP</h4>
      <div id="legendRows"></div>
    </div>
  </div>

  <div id="console">
    <div class="screw tl"></div><div class="screw tr"></div>
    <div class="screw bl"></div><div class="screw br"></div>

    <label id="fileLabel" for="fileInput">LOAD TRACK</label>
    <input type="file" id="fileInput" accept="audio/*">

    <div class="grp">
      <button class="deck-btn" id="playBtn" title="Play / Pause (space)">&#9658;</button>
      <button class="deck-btn" id="stopBtn" title="Stop">&#9632;</button>
    </div>

    <div id="lcd">
      <div class="beatled" id="beatLed"></div>
      <div id="trackName">NO SIGNAL</div>
      <div id="timeReadout">00:00 / 00:00</div>
    </div>

    <div class="grp" style="flex:1 1 160px; min-width:120px;">
      <span class="lbl">SEEK</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
    </div>

    <div class="grp">
      <span class="lbl">VOL</span>
      <input type="range" id="volume" min="0" max="100" value="80">
    </div>

    <div class="grp">
      <button class="deck-btn" id="legendBtn" title="Toggle legend (L)">i</button>
      <button class="deck-btn" id="compactBtn" title="Compact mode (C)">▭</button>
      <button class="deck-btn" id="fullscreenBtn" title="Fullscreen (F)">⛶</button>
    </div>
  </div>
</div>

<audio id="audioEl" crossorigin="anonymous"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

  // ---------------------------------------------------------------------
  // PLANET / FREQUENCY BAND DEFINITIONS (real solar-system order, outer->inner)
  // ---------------------------------------------------------------------
  const PLANETS = [
    { key:'neptune', name:'NEPTUNE', freqLo:20,   freqHi:45,   orbitFrac:0.92, size:0.34, period:165.0,
      base:0x2c4fb0, glow:0x5a86ff, ring:false, kind:'storm', spot:0x16306e, incline:0.09 },
    { key:'uranus',  name:'URANUS',  freqLo:45,   freqHi:100,  orbitFrac:0.80, size:0.36, period:84.0,
      base:0x6fd8d4, glow:0xa6fbf5, ring:true,  ringColor:0xa0e6e1, ringTilt:1.35, kind:'flat', incline:-0.06 },
    { key:'saturn',  name:'SATURN',  freqLo:100,  freqHi:220,  orbitFrac:0.67, size:0.46, period:29.5,
      base:0xe8c989, glow:0xffe3a3, ring:true,  ringColor:0xe8c989, ringTilt:0.45, kind:'bands', incline:0.05 },
    { key:'jupiter', name:'JUPITER', freqLo:220,  freqHi:500,  orbitFrac:0.55, size:0.56, period:11.9,
      base:0xd8a465, glow:0xffbf70, ring:false, kind:'bands', spot:0xb5502f, incline:-0.04 },
    { key:'mars',    name:'MARS',    freqLo:500,  freqHi:1100, orbitFrac:0.44, size:0.22, period:1.88,
      base:0xb5502f, glow:0xff6b3d, ring:false, kind:'rocky', incline:0.07 },
    { key:'earth',   name:'EARTH',   freqLo:1100, freqHi:2500, orbitFrac:0.34, size:0.26, period:1.0,
      base:0x2f7fae, glow:0x4fd1ff, ring:false, kind:'earth', incline:0.0 },
    { key:'venus',   name:'VENUS',   freqLo:2500, freqHi:6000, orbitFrac:0.24, size:0.25, period:0.62,
      base:0xe8d59a, glow:0xfff2c2, ring:false, kind:'cloud', incline:-0.05 },
    { key:'mercury', name:'MERCURY', freqLo:6000, freqHi:14000,orbitFrac:0.14, size:0.15, period:0.24,
      base:0x9a9aa0, glow:0xe0e0e6, ring:false, kind:'rocky', incline:0.08 },
  ];

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------
  const sceneWrap = document.getElementById('scene-wrap');
  const canvas = document.getElementById('scene');
  const hint = document.getElementById('hint');
  const audioEl = document.getElementById('audioEl');
  const fileInput = document.getElementById('fileInput');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const seek = document.getElementById('seek');
  const volume = document.getElementById('volume');
  const trackName = document.getElementById('trackName');
  const timeReadout = document.getElementById('timeReadout');
  const beatLed = document.getElementById('beatLed');
  const legend = document.getElementById('legend');
  const legendRows = document.getElementById('legendRows');
  const legendBtn = document.getElementById('legendBtn');
  const compactBtn = document.getElementById('compactBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  legendRows.innerHTML = PLANETS.slice().reverse().map(p => `
    <div class="row">
      <span class="dot" style="background:#${p.base.toString(16).padStart(6,'0')}; box-shadow:0 0 6px #${p.glow.toString(16).padStart(6,'0')}"></span>
      <span>${p.name}</span>
      <span class="hz">${p.freqLo}-${p.freqHi >= 1000 ? (p.freqHi/1000)+'k' : p.freqHi}Hz</span>
    </div>`).join('');

  // ---------------------------------------------------------------------
  // AUDIO GRAPH
  // ---------------------------------------------------------------------
  let audioCtx, analyser, sourceNode, gainNode;
  let dataArray, bufferLength;
  let bandBinRanges = null;

  function ensureAudioGraph(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.0;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    gainNode = audioCtx.createGain();
    gainNode.gain.value = volume.value / 100;

    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    computeBandBins();
  }

  function computeBandBins(){
    const nyquist = audioCtx.sampleRate / 2;
    bandBinRanges = PLANETS.map(p => {
      let lo = Math.floor((p.freqLo / nyquist) * bufferLength);
      let hi = Math.ceil((p.freqHi / nyquist) * bufferLength);
      lo = Math.max(0, Math.min(lo, bufferLength - 1));
      hi = Math.max(lo + 1, Math.min(hi, bufferLength));
      return [lo, hi];
    });
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    ensureAudioGraph();
    audioEl.src = URL.createObjectURL(file);
    trackName.textContent = file.name.replace(/\.[^/.]+$/, '').toUpperCase();
    hint.style.opacity = '0';
    audioEl.play();
    audioCtx.resume();
  });

  playBtn.addEventListener('click', () => {
    if(!audioEl.src) return;
    ensureAudioGraph();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(audioEl.paused){ audioEl.play(); } else { audioEl.pause(); }
  });
  stopBtn.addEventListener('click', () => {
    if(!audioEl.src) return;
    audioEl.pause(); audioEl.currentTime = 0;
  });
  audioEl.addEventListener('play', () => playBtn.innerHTML = '&#10074;&#10074;');
  audioEl.addEventListener('pause', () => playBtn.innerHTML = '&#9658;');

  seek.addEventListener('input', () => {
    if(!audioEl.duration) return;
    audioEl.currentTime = (seek.value / 1000) * audioEl.duration;
  });
  volume.addEventListener('input', () => { if(gainNode) gainNode.gain.value = volume.value / 100; });

  function fmtTime(s){
    if(!isFinite(s)) return '00:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  audioEl.addEventListener('timeupdate', () => {
    if(audioEl.duration){
      seek.value = (audioEl.currentTime / audioEl.duration) * 1000;
      timeReadout.textContent = fmtTime(audioEl.currentTime) + ' / ' + fmtTime(audioEl.duration);
    }
  });

  // ---------------------------------------------------------------------
  // THREE.JS SCENE SETUP
  // ---------------------------------------------------------------------
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03040a, 0.028);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setClearColor(0x03040a, 1);

  scene.add(new THREE.AmbientLight(0x30345a, 1.1));
  const sunLight = new THREE.PointLight(0xfff2cf, 2.6, 60, 1.6);
  scene.add(sunLight);

  // ---- starfield (real depth via 3D points) ----
  (function buildStars(){
    const count = 3200;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    for(let i=0;i<count;i++){
      const r = 25 + Math.random()*70;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1] = r*Math.cos(phi)*0.6;
      positions[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({ color:0xcfd8ff, size:0.09, sizeAttenuation:true, transparent:true, opacity:0.85 });
    scene.add(new THREE.Points(geo, mat));
  })();

  // ---- shared glow sprite texture ----
  const glowTexture = (function(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64,64,0,64,64,64);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.5)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();

  function makeGlowSprite(color, size){
    const mat = new THREE.SpriteMaterial({ map:glowTexture, color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(size,size,1);
    return spr;
  }

  // ---- procedural planet texture (canvas -> CanvasTexture) ----
  function makePlanetTexture(p){
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    const baseHex = '#' + p.base.toString(16).padStart(6,'0');
    g.fillStyle = baseHex; g.fillRect(0,0,256,128);

    function darken(hex, amt){
      const num = parseInt(hex.replace('#',''),16);
      const r=(num>>16)&255, gg=(num>>8)&255, b=num&255;
      return `rgb(${r*(1-amt)|0},${gg*(1-amt)|0},${b*(1-amt)|0})`;
    }
    function lighten(hex, amt){
      const num = parseInt(hex.replace('#',''),16);
      const r=(num>>16)&255, gg=(num>>8)&255, b=num&255;
      return `rgb(${r+(255-r)*amt|0},${gg+(255-gg)*amt|0},${b+(255-b)*amt|0})`;
    }

    if(p.kind === 'bands' || p.kind === 'storm'){
      const bands = p.kind === 'storm' ? 5 : 8;
      for(let i=0;i<bands;i++){
        g.fillStyle = darken(baseHex, 0.12 + 0.1*(i%2));
        g.globalAlpha = 0.55;
        g.fillRect(0, i*(128/bands), 256, 128/bands * 0.6);
      }
      g.globalAlpha = 1;
      if(p.spot){
        g.fillStyle = '#' + p.spot.toString(16).padStart(6,'0');
        g.beginPath(); g.ellipse(180, 70, 26, 14, 0.3, 0, Math.PI*2); g.fill();
      }
    } else if(p.kind === 'earth'){
      g.fillStyle = 'rgba(63,174,90,0.75)';
      g.beginPath(); g.ellipse(60,50,55,30,0.4,0,Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(170,85,45,25,-0.3,0,Math.PI*2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.beginPath(); g.ellipse(120,25,70,18,0.1,0,Math.PI*2); g.fill();
    } else if(p.kind === 'cloud'){
      for(let i=0;i<10;i++){
        g.fillStyle = lighten(baseHex, 0.18) ;
        g.globalAlpha = 0.28;
        g.beginPath(); g.ellipse(Math.random()*256, Math.random()*128, 45, 12, Math.random()*3, 0, Math.PI*2); g.fill();
      }
      g.globalAlpha = 1;
    } else if(p.kind === 'rocky'){
      for(let i=0;i<26;i++){
        g.fillStyle = darken(baseHex, 0.3);
        g.globalAlpha = 0.55;
        const r = 3 + Math.random()*7;
        g.beginPath(); g.arc(Math.random()*256, Math.random()*128, r, 0, Math.PI*2); g.fill();
      }
      g.globalAlpha = 1;
    } else if(p.kind === 'flat'){
      g.fillStyle = lighten(baseHex, 0.1); g.globalAlpha = 0.25;
      g.fillRect(0, 54, 256, 20);
      g.globalAlpha = 1;
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  }

  // ---- sun ----
  const sunGeo = new THREE.SphereGeometry(0.9, 32, 32);
  const sunMat = new THREE.MeshBasicMaterial({ color:0xfff2c8 });
  const sunMesh = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sunMesh);
  const sunGlow = makeGlowSprite(0xffcf7a, 5);
  scene.add(sunGlow);

  // ---- orbit rings (flat annulus, additive) ----
  const maxR = 9.2;
  const orbitMeshes = [];
  PLANETS.forEach(p => {
    const r = p.orbitFrac * maxR;
    const geo = new THREE.RingGeometry(r - 0.012, r + 0.012, 128);
    const mat = new THREE.MeshBasicMaterial({ color:p.base, transparent:true, opacity:0.12, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.PI/2 + p.incline;
    scene.add(mesh);
    orbitMeshes.push(mesh);
  });

  // ---- planets ----
  const planetGroups = PLANETS.map(p => {
    const group = new THREE.Group();
    const tex = makePlanetTexture(p);
    const geo = new THREE.SphereGeometry(p.size, 24, 24);
    const mat = new THREE.MeshStandardMaterial({ map:tex, emissive:new THREE.Color(p.glow), emissiveIntensity:0.15, roughness:0.75, metalness:0.05 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.z = p.incline;
    group.add(mesh);

    if(p.ring){
      const ringGeo = new THREE.RingGeometry(p.size*1.4, p.size*2.1, 48);
      const ringMat = new THREE.MeshBasicMaterial({ color:p.ringColor, transparent:true, opacity:0.5, side:THREE.DoubleSide });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI/2 - p.ringTilt;
      group.add(ringMesh);
    }

    const glow = makeGlowSprite(p.glow, p.size * 4.2);
    group.add(glow);

    scene.add(group);
    return { group, mesh, mat, glow, orbitR: p.orbitFrac * maxR, incline:p.incline };
  });

  // ---------------------------------------------------------------------
  // RUNTIME STATE / AUDIO REACTIVITY
  // ---------------------------------------------------------------------
  const state = PLANETS.map(() => ({ angle: Math.random()*Math.PI*2, smooth:0, punch:0 }));
  let bassHistory = [];
  let lastBeatTime = 0;
  let beatFlashUntil = 0;
  const shockwaves = []; // {mesh}

  function spawnShockwave(){
    const geo = new THREE.RingGeometry(0.05, 0.16, 64);
    const mat = new THREE.MeshBasicMaterial({ color:0xffdb8c, transparent:true, opacity:0.85, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = Math.PI/2;
    scene.add(mesh);
    shockwaves.push({ mesh, r:0.1, alpha:0.85 });
  }

  function updateAudioFrame(dtSec, tNow){
    let bassRaw = 0;
    if(analyser && !audioEl.paused){
      analyser.getByteFrequencyData(dataArray);
      PLANETS.forEach((p,i) => {
        const [lo,hi] = bandBinRanges[i];
        let sum=0; for(let b=lo;b<hi;b++) sum += dataArray[b];
        const raw = (sum/(hi-lo))/255;
        const st = state[i];
        st.smooth += (raw - st.smooth) * 0.15;
        st.punch = Math.max(st.punch*0.86, raw);
        if(p.key==='neptune' || p.key==='uranus') bassRaw += raw*0.5;
      });
    } else {
      PLANETS.forEach((p,i) => {
        const st = state[i];
        const idle = 0.05 + 0.04*Math.sin(tNow*0.5+i);
        st.smooth += (idle - st.smooth) * 0.05;
        st.punch *= 0.9;
      });
    }

    bassHistory.push(bassRaw);
    if(bassHistory.length > 40) bassHistory.shift();
    const avg = bassHistory.reduce((a,b)=>a+b,0)/bassHistory.length;
    if(bassRaw > avg*1.35 && bassRaw > 0.22 && (tNow-lastBeatTime) > 0.18){
      lastBeatTime = tNow;
      beatFlashUntil = tNow + 0.09;
      spawnShockwave();
    }
    beatLed.classList.toggle('on', tNow < beatFlashUntil);

    const speedMul = reduceMotion ? 0.15 : 1;
    PLANETS.forEach((p,i) => {
      state[i].angle += (0.5/Math.sqrt(p.period)) * speedMul * dtSec;
    });

    for(let i=shockwaves.length-1;i>=0;i--){
      const s = shockwaves[i];
      s.r += 4.2 * dtSec;
      s.alpha -= 1.1 * dtSec;
      s.mesh.geometry.dispose();
      s.mesh.geometry = new THREE.RingGeometry(Math.max(0.02,s.r-0.05), s.r, 64);
      s.mesh.material.opacity = Math.max(0, s.alpha);
      if(s.alpha <= 0){
        scene.remove(s.mesh);
        s.mesh.geometry.dispose(); s.mesh.material.dispose();
        shockwaves.splice(i,1);
      }
    }
  }

  // ---------------------------------------------------------------------
  // CAMERA CONTROLS (custom orbit-drag, no external addon needed)
  // ---------------------------------------------------------------------
  let azimuth = 0.5, polar = 1.05, radius = 15;
  let targetAzimuth = azimuth, targetPolar = polar, targetRadius = radius;
  let dragging = false, lastX = 0, lastY = 0, lastInteract = 0;

  sceneWrap.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetAzimuth -= dx * 0.006;
    targetPolar = Math.max(0.25, Math.min(1.45, targetPolar - dy * 0.006));
    lastInteract = performance.now();
  });
  sceneWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetRadius = Math.max(5, Math.min(30, targetRadius + e.deltaY * 0.01));
    lastInteract = performance.now();
  }, { passive:false });

  // ---------------------------------------------------------------------
  // RESIZE
  // ---------------------------------------------------------------------
  function resize(){
    const rect = sceneWrap.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------------
  // MAIN LOOP
  // ---------------------------------------------------------------------
  let lastT = performance.now();

  function frame(now){
    const dtSec = Math.min((now-lastT)/1000, 0.05);
    lastT = now;
    const tNow = now/1000;

    updateAudioFrame(dtSec, tNow);

    // idle auto-rotate after 2.2s of no interaction
    if(now - lastInteract > 2200 && !reduceMotion){
      targetAzimuth += 0.00035 * (dtSec*60);
    }
    azimuth += (targetAzimuth - azimuth) * 0.08;
    polar += (targetPolar - polar) * 0.08;
    radius += (targetRadius - radius) * 0.08;

    let overall = 0; state.forEach(st => overall += st.smooth); overall /= state.length;
    const bob = Math.sin(tNow*0.35) * 0.15 + overall*0.25;

    camera.position.set(
      radius * Math.sin(polar) * Math.sin(azimuth),
      radius * Math.cos(polar) + bob,
      radius * Math.sin(polar) * Math.cos(azimuth)
    );
    camera.lookAt(0,0,0);

    // sun pulse
    const sunScale = 1 + overall*0.5 + (tNow < beatFlashUntil ? 0.25 : 0);
    sunMesh.scale.setScalar(sunScale);
    sunGlow.scale.set(5*sunScale, 5*sunScale, 1);
    sunLight.intensity = 2.2 + overall*2.5 + (tNow < beatFlashUntil ? 1.2 : 0);

    // orbit ring glow
    orbitMeshes.forEach((mesh,i) => {
      const st = state[i];
      mesh.material.opacity = 0.08 + st.smooth*0.5;
      const s = 1 + st.punch*0.01;
      mesh.scale.set(s,s,1);
    });

    // planets
    planetGroups.forEach((pg,i) => {
      const st = state[i];
      const angle = st.angle;
      pg.group.position.set(
        Math.cos(angle) * pg.orbitR,
        Math.sin(pg.incline) * pg.orbitR * 0.12,
        Math.sin(angle) * pg.orbitR
      );
      const scale = 1 + st.punch*0.4;
      pg.mesh.scale.setScalar(scale);
      pg.mat.emissiveIntensity = 0.12 + st.smooth*0.9 + st.punch*0.6;
      pg.mesh.rotation.y += dtSec * 0.15;
      pg.glow.material.opacity = 0.55 + st.punch*0.4;
      const gScale = (PLANETS[i].size*4.2) * (1 + st.punch*0.5);
      pg.glow.scale.set(gScale, gScale, 1);
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // UI: legend / compact / fullscreen / keyboard
  // ---------------------------------------------------------------------
  let legendOn = true;
  legendBtn.addEventListener('click', () => {
    legendOn = !legendOn;
    legend.style.display = legendOn ? 'block' : 'none';
  });
  compactBtn.addEventListener('click', () => {
    document.body.classList.toggle('compact');
    compactBtn.classList.toggle('active');
    setTimeout(resize, 360);
  });
  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else { document.exitFullscreen(); }
  });
  document.addEventListener('fullscreenchange', () => setTimeout(resize, 60));

  window.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
    else if(e.key.toLowerCase() === 'f'){ fullscreenBtn.click(); }
    else if(e.key.toLowerCase() === 'c'){ compactBtn.click(); }
    else if(e.key.toLowerCase() === 'l'){ legendBtn.click(); }
  });

  // ---------------------------------------------------------------------
  // BOOT
  // ---------------------------------------------------------------------
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
