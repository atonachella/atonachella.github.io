<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Portal Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="engineCanvas"></canvas>

    <div class="crt-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="hud">
        <div class="hud-box top-left">
            <div class="label">SYS.CORE</div>
            <div class="value" id="hud-state">INITIALIZING...</div>
        </div>
        <div class="hud-box top-right">
            <div class="label">VELOCITY</div>
            <div class="value" id="hud-velocity">0.00 KM/S</div>
        </div>
        <div class="hud-box bottom-left">
            <div class="label">COORDINATES</div>
            <div class="value" id="hud-coords">X: 0 | Y: 0 | Z: 0</div>
        </div>
        <div class="hud-box bottom-right">
            <div class="label">CHRONO</div>
            <div class="value" id="hud-timer">00:00:00</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
