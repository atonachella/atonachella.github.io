<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home Adventure</title>
    <style>
        /* ==========================================================================
           1. DEFAULT / LOGIN UTILITIES
           ========================================================================== */
        * {
            box-sizing: border-box;
            transition: all 0.5s ease; /* Makes the theme transition smooth! */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }

        .app-container {
            background-color: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        /* Screen Visibility Toggles */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Form Inputs & Buttons */
        select, input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        
        select:focus, input:focus {
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #ff3b30;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ==========================================================================
           2. THEME CONFIGURATIONS (Applied via JavaScript classes on <body>)
           ========================================================================== */
        
        /* 🐳 MARINE THEME (10-Year-Old) */
        body.theme-marine {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        }
        body.theme-marine .app-container {
            background-color: rgba(255, 255, 255, 0.95);
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }
        body.theme-marine h1 {
            color: #0072ff;
        }
        body.theme-marine button {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
        }

        /* 🦄 PLAYFUL THEME (7-Year-Old) */
        body.theme-playful {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        }
        body.theme-playful .app-container {
            background-color: white;
            border: 4px dashed #ff6b6b;
        }
        body.theme-playful h1 {
            color: #ff6b81;
        }
        body.theme-playful button {
            background: linear-gradient(to right, #ff6b81, #ff4757);
            color: white;
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Extra playful font choice */
        }

        :root {
    /* Playful/Magic Theme Colors (Left Side) */
    --left-bg: #9b5de5; 
    --left-text: #fee440;
    
    /* Marine/Sonar Theme Colors (Right Side) */
    --right-bg: #0a1912;
    --right-text: #00ff66;
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: sans-serif;
    overflow: hidden;
}

/* The Magic Diagonal Split Background */
.split-screen {
    display: flex;
    width: 100%;
    height: 100%;
    /* 135 degrees creates a perfect top-left to bottom-right diagonal split */
    background: linear-gradient(135deg, 
                var(--left-bg) 0%, 
                var(--left-bg) 50%, 
                var(--right-bg) 50%, 
                var(--right-bg) 100%);
}

/* Base style for both sides */
.side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    z-index: 1;
    transition: transform 0.3s ease;
}

/* Subtle hover effect to make it interactive */
.side:hover {
    transform: scale(1.02);
}

/* Left Side Adjustments (Offset content slightly so it doesn't cross the diagonal line) */
.side.left {
    color: var(--left-text);
    padding-right: 5%; 
}

/* Right Side Adjustments */
.side.right {
    color: var(--right-text);
    padding-left: 5%;
    font-family: 'Courier New', Courier, monospace; /* Matching her terminal look */
}

/* Fun Dynamic Entry Buttons */
.portal-btn {
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border: 3px solid currentColor;
    background: transparent;
    color: inherit;
    cursor: pointer;
    border-radius: 30px;
    margin-top: 20px;
    transition: all 0.2s ease;
}

.portal-btn:hover {
    background: currentColor;
    /* Flips the color on hover dynamically */
    color: var(--left-bg); 
}

.right .portal-btn:hover {
    color: var(--right-bg);
}
    </style>
</head>
<body>

<div class="split-screen">
    
    <div class="side left">
        <h1>🌟 Playful World 🧸</h1>
        <p>Ready for Magic & Mini-Games?</p>
        <button class="portal-btn" onclick="location.href='playful.html'">Enter Portal</button>
    </div>
    
    <div class="side right">
        <h1>📡 Marine Command 🐋</h1>
        <p>SYSTEM STATUS: READY FOR SCAN</p>
        <button class="portal-btn" onclick="location.href='marine.html'">Initialize Sonar</button>
    </div>

</div>

<script>
    // ✏️ SET YOUR PASSWORDS HERE
    // You can change these strings to whatever words you want them to type.
    const PASSWORDS = {
        older: "ocean10",    // Password for the 10-year-old
        younger: "magic7"    // Password for the 7-year-old
    };

    function handleLogin() {
        const selectedUser = document.getElementById("user-select").value;
        const enteredPassword = document.getElementById("password-input").value;
        const errorDiv = document.getElementById("login-error");

        // Reset error message
        errorDiv.innerText = "";

        // Check if password matches the chosen user
        if (enteredPassword === PASSWORDS[selectedUser]) {
            
            // Hide the login screen
            document.getElementById("login-screen").classList.remove("active");

            if (selectedUser === "older") {
                // Apply Marine Theme and show Marine Screen
                window.location.href = "marine.html";
            } else if (selectedUser === "younger") {
                // Apply Playful Theme and show Playful Screen
                window.location.href = "playful.html";
            }
            
            // Clear password field for security
            document.getElementById("password-input").value = "";

        } else {
            // Wrong password feedback
            errorDiv.innerText = "❌ Incorrect code. Try again!";
        }
    }

    function logout() {
        // Hide all game screens
        document.getElementById("marine-screen").classList.remove("active");
        document.getElementById("playful-screen").classList.remove("active");
        
        // Remove background themes
        document.body.className = "";
        
        // Bring back login screen
        document.getElementById("login-screen").classList.add("active");
    }
</script>

</body>
</html>
