<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home! 🏠</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">
        <div class="original-content-container" style="text-align: center; margin-top: 100px;">
            <h1>Enter Your Code to Play!</h1>
            
            <div style="margin: 20px 0;">
                <input type="password" id="childCode" placeholder="Enter code..." style="padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc;">
                <button onclick="checkAccessCode()" style="padding: 10px 20px; font-size: 16px; border-radius: 8px; background: #4b7bec; color: white; border: none; cursor: pointer;">Go!</button>
            </div>
        </div>
    </div>

    <script>
        // Place your existing continuity login verification code right here
        function checkAccessCode() {
            const code = document.getElementById('childCode').value.trim().toLowerCase();
            
            // Example Placeholder logic routing to separate pages based on code matching
            if (code === 'sophia' || code === 'marine') {
                window.location.href = 'marine.html';
            } else if (code === 'natalia' || code === 'playful') {
                window.location.href = 'playful.html';
            } else {
                alert('Try again, adventurer!');
            }
        }
    </script>
</body>
</html>
