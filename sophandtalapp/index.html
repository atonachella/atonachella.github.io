<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret Home Portal 🌟🌊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="split-body">

    <div class="portal-card">
        <h1 style="margin: 0 0 20px 0; font-size: 2.2rem; color: #2f3542;">Secret Dashboard Sign In</h1>
        
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px;">Select Adventurer:</label>
            <select id="childSelect" class="portal-dropdown">
                <option value="" disabled selected>Who is signing in? ...</option>
                <option value="sophia">Sophia 🌊 (Ocean Base)</option>
                <option value="natalia">Natalia 🪄 (Magic Base)</option>
            </select>
        </div>

        <div style="text-align: left; margin-bottom: 25px;">
            <label style="font-weight: bold; display: block; margin-bottom: 6px;">Enter Passkey:</label>
            <input type="password" id="childCode" class="portal-input" placeholder="Type password here...">
        </div>

        <button onclick="verifyAndLogin()" class="portal-button">Launch Dashboard 🚀</button>
        <div id="errorBox" style="color: #e74c3c; font-weight: bold; margin-top: 15px; min-height: 20px;"></div>
    </div>

    <script>
        function verifyAndLogin() {
            const user = document.getElementById('childSelect').value;
            const pass = document.getElementById('childCode').value.trim();
            const err = document.getElementById('errorBox');
            err.textContent = "";

            if (!user) {
                err.textContent = "Please choose a name first!";
                return;
            }

            if (user === 'sophia') {
                if (pass === 'ocean10') {
                    window.location.href = 'marine.html';
                } else {
                    err.textContent = "Wrong passcode for Sophia's Ocean!";
                }
            } else if (user === 'natalia') {
                if (pass === 'magic7') {
                    window.location.href = 'playful.html';
                } else {
                    err.textContent = "Wrong passcode for Natalia's Magic!";
                }
            }
        }
        document.getElementById('childCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAndLogin();
        });
    </script>
</body>
</html>
