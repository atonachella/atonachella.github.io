<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home Adventure</title>
    <style>
   :root {
    /* Playful/Magic Theme Colors (Left Side) */
    --left-bg: #9b5de5; 
    --left-text: #fee440;
    --left-hover-bg: #fee440;
    --left-hover-text: #4a0e4e;
    
    /* Marine/Sonar Theme Colors (Right Side) */
    --right-bg: #0a1912;
    --right-text: #00ff66;
    --right-hover-bg: #00ff66;
    --right-hover-text: #0a1912;
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    overflow: hidden;
}

/* The Magic Diagonal Split Background */
.split-screen {
    display: flex;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, 
                var(--left-bg) 0%, 
                var(--left-bg) 50%, 
                var(--right-bg) 50%, 
                var(--right-bg) 100%);
}

.side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    z-index: 1;
}

.side.left {
    color: var(--left-text);
    padding-right: 5%; 
}

.side.right {
    color: var(--right-text);
    padding-left: 5%;
    font-family: 'Courier New', Courier, monospace;
}

/* Dropdown Menu Styling */
.kid-dropdown {
    padding: 12px 20px;
    font-size: 1.2rem;
    font-weight: bold;
    border: 3px solid currentColor;
    border-radius: 25px;
    background: white;
    color: #333;
    cursor: pointer;
    outline: none;
    margin-bottom: 20px;
    width: 220px;
    text-align: center;
}

.right .kid-dropdown {
    background: #000;
    color: var(--right-text);
    border-radius: 5px;
    font-family: inherit;
}

/* Fixed Portal Buttons with High-Contrast Hover Effects */
.portal-btn {
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border: 3px solid currentColor;
    background: transparent;
    color: inherit;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.2s ease;
}

/* Left side hover: Yellow background, dark purple text */
.left .portal-btn:hover {
    background-color: var(--left-hover-bg);
    color: var(--left-hover-text);
}

/* Right side hover: Neon green background, deep dark green text */
.right .portal-btn:hover {
    background-color: var(--right-hover-bg);
    color: var(--right-hover-text);
    box-shadow: 0 0 15px var(--right-text);
}
    </style>
</head>
<body>

<div class="split-screen">
    
    <div class="side left">
        <h1>🌟 Playful World 🧸</h1>
        <select id="playful-select" class="kid-dropdown">
            <option value="" disabled selected>Who is exploring?</option>
            <option value="playful.html">Tal</option> </select>
        <button class="portal-btn" onclick="launchPlayful()">Let's Play! ✨</button>
    </div>
    
    <div class="side right">
        <h1>📡 Marine Command 🐋</h1>
        <select id="marine-select" class="kid-dropdown">
            <option value="" disabled selected>SELECT OPERATOR...</option>
            <option value="marine.html">Soph</option> </select>
        <button class="portal-btn" onclick="launchMarine()">INITIALIZE 🚀</button>
    </div>

</div>

<script>
function launchPlayful() {
    const page = document.getElementById('playful-select').value;
    if (page) {
        window.location.href = page;
    } else {
        alert("✨ Please select your name first! ✨");
    }
}

function launchMarine() {
    const page = document.getElementById('marine-select').value;
    if (page) {
        window.location.href = page;
    } else {
        alert("❌ ERROR: SELECT OPERATOR TO ACCESS RADAR SYSTEM.");
    }
}
</script>

</body>
</html>
