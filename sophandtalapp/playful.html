<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalia's Magic Land</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Twilight Magical Theme */
        body { background-color: #09040d; margin: 0; padding: 20px; font-family: 'Consolas', monospace; color: #fff; }
        .magic-section { background-color: #140b1c; border: 2px solid #ed4c67; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        h2 { color: #ff6b81; margin-top: 0; }
        
        /* Memory Grid */
        .memory-game-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 340px; margin: 20px auto; }
        .memory-card { aspect-ratio: 1 / 1; background-color: #2c163f; border: 2px solid #ed4c67; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        .memory-card.flipped { background-color: #5352ed; }
        
        /* Trivia */
        .magic-trivia-btn { background-color: #241233; color: #fff; border: 1px solid #ed4c67; padding: 10px; margin: 5px 0; width: 100%; cursor: pointer; }
        
        /* Color Grid */
        .cbn-grid-playful { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; max-width: 420px; margin: 20px auto; }
        .cbn-pixel { aspect-ratio: 1 / 1; background-color: #241233; border: 1px solid #3b1d54; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; cursor: pointer; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;">
        <header style="background: #ed4c67; padding: 15px; text-align: center; border-radius: 12px;">
            <h1>Natalia's Magic Land of Beauty 🦄</h1>
        </header>

        <section class="magic-section">
            <h2>Magical Match Memory 👑</h2>
            <div class="memory-game-container" id="memory-board"></div>
            <p id="memory-status" style="text-align: center;">Matches Found: 0 / 4</p>
        </section>

        <section class="magic-section">
            <h2>Enchanted Fact Explorer ✨</h2>
            <div id="magic-trivia-box">
                <p><strong id="magic-question-text">Loading...</strong></p>
                <div id="magic-answers-box"></div>
                <div id="t2" style="margin-top: 10px;"></div>
            </div>
        </section>

        <section class="magic-section">
            <h2>Secret Unicorn Canvas 🎨</h2>
            <div class="cbn-grid-playful" id="playful-ocean-grid"></div>
        </section>
    </div>

    <script>
        // MEMORY GAME LOGIC
        const icons = ["🦄", "🦄", "🧜‍♀️", "🧜‍♀️", "🧚‍♀️", "🧚‍♀️", "👑", "👑"].sort(() => 0.5 - Math.random());
        const board = document.getElementById("memory-board");
        let active = [];
        icons.forEach(icon => {
            const div = document.createElement("div");
            div.className = "memory-card";
            div.innerHTML = `<span style="visibility:hidden">${icon}</span>`;
            div.onclick = () => {
                div.classList.add("flipped");
                div.firstChild.style.visibility = "visible";
                active.push(div);
                if(active.length === 2) {
                    if(active[0].innerText === active[1].innerText) active = [];
                    else setTimeout(() => { active.forEach(c => { c.classList.remove("flipped"); c.firstChild.style.visibility="hidden"}); active = [] }, 800);
                }
            };
            board.appendChild(div);
        });

        // TRIVIA LOGIC
        const trivia = [{q: "What creature is the 'Unicorn of the Sea'?", a: ["Narwhal", "Fish"], c: 0}, {q: "What do fairies use to grow flowers?", a: ["Magic Pollen", "Dirt"], c: 0}];
        let qIdx = 0;
        function loadQ() {
            document.getElementById("magic-question-text").innerText = trivia[qIdx].q;
            const box = document.getElementById("magic-answers-box"); box.innerHTML = "";
            trivia[qIdx].a.forEach((opt, i) => {
                const btn = document.createElement("button"); btn.innerText = opt; btn.className = "magic-trivia-btn";
                btn.onclick = () => { document.getElementById("t2").innerText = i === trivia[qIdx].c ? "Correct! ✨" : "Try again!"; if(i===trivia[qIdx].c) setTimeout(()=>{qIdx++; loadQ()}, 1000) };
                box.appendChild(btn);
            });
        }
        loadQ();

        // COLOR BY NUMBER LOGIC
        const grid = document.getElementById("playful-ocean-grid");
        for(let i=0; i<144; i++) {
            const p = document.createElement("div"); p.className = "cbn-pixel"; p.innerText = (i%12)+1;
            p.onclick = () => p.style.backgroundColor = "#ed4c67";
            grid.appendChild(p);
        }
    </script>
</body>
</html>
