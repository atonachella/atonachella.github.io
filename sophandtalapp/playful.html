<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalia's Magic Land</title>
    <style>
        body { background-color: #09040d; margin: 0; padding: 20px; font-family: 'Consolas', monospace; color: #fff; }
        .magic-section { background-color: #140b1c; border: 2px solid #ed4c67; border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        h2 { color: #ff6b81; border-bottom: 1px solid #ed4c67; padding-bottom: 8px; }
        .memory-game-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 500px; margin: 20px auto; }
        .memory-card { aspect-ratio: 1 / 1; background-color: #2c163f; border: 2px solid #ed4c67; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .memory-card.flipped { background-color: #5352ed; }
        .cbn-grid-playful { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-width: 350px; margin: 20px auto; border: 2px solid #ed4c67; }
        .cbn-pixel { aspect-ratio: 1 / 1; background-color: #241233; border: 1px solid #3b1d54; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #442a5a; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <header style="background: #ed4c67; padding: 15px; text-align: center; border-radius: 12px; margin-bottom: 25px;">
            <h1>Natalia's Magic Land of Beauty 🦄</h1>
        </header>

        <section class="magic-section">
            <h2>Magical Match Memory 👑</h2>
            <div class="memory-game-container" id="memory-board"></div>
            <p id="memory-status" style="text-align: center; font-weight: bold;">Matches Found: 0 / 12</p>
        </section>

        <section class="magic-section">
            <h2>Secret Full-Canvas Art 🎨</h2>
            <div id="playful-palette" style="display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;"></div>
            <div class="cbn-grid-playful" id="playful-ocean-grid"></div>
        </section>
    </div>

    <script>
        // 1. MEMORY GAME (Untouched)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(f1, f2, dur) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        const board = document.getElementById("memory-board");
        const status = document.getElementById("memory-status");
        const icons = ["🦄","🦄","🧜‍♀️","🧜‍♀️","🧚‍♀️","🧚‍♀️","👑","👑","🌈","🌈","✨","✨","🌸","🌸","🦋","🦋","🍭","🍭","💎","💎","🎀","🎀","🌟","🌟"].sort(() => 0.5 - Math.random());
        let active = [], matches = 0;

        icons.forEach(icon => {
            const div = document.createElement("div");
            div.className = "memory-card";
            div.innerHTML = `<span style="visibility:hidden">${icon}</span>`;
            div.onclick = () => {
                if(div.classList.contains("flipped") || active.length >= 2) return;
                div.classList.add("flipped");
                div.firstChild.style.visibility = "visible";
                active.push(div);
                if(active.length === 2) {
                    if(active[0].innerText === active[1].innerText) {
                        playSound(1200, 1800, 0.3); matches++;
                        status.innerText = `Matches Found: ${matches} / 12`;
                        active = [];
                    } else {
                        playSound(400, 200, 0.2);
                        setTimeout(() => { active.forEach(c => { c.classList.remove("flipped"); c.firstChild.style.visibility="hidden"}); active = [] }, 800);
                    }
                }
            };
            board.appendChild(div);
        });

        // 2. COLOR BY NUMBER (10x10 Full Fill - 8 Colors)
        // 1:DarkPurple, 2:Magenta, 3:LightPink, 4:BrightCyan, 5:Gold, 6:White, 7:BrightBlue, 8:Emerald
        const gridMap = [
            1,1,1,1,2,2,1,1,1,1, 1,1,1,2,3,3,2,1,1,1, 1,1,2,3,3,3,3,2,1,1, 1,2,3,3,3,3,3,3,2,1, 2,2,3,3,4,4,3,3,2,2,
            2,2,3,3,4,4,3,3,2,2, 1,2,3,5,5,5,5,3,2,1, 1,1,2,5,6,6,5,2,1,1, 1,1,1,7,7,7,7,1,1,1, 1,1,1,8,8,8,8,1,1,1
        ];
        const colorKey = { 1: "#241233", 2: "#ed4c67", 3: "#ff6b81", 4: "#00d2d3", 5: "#f1c40f", 6: "#ffffff", 7: "#1e90ff", 8: "#2ed573" };
        let selectedColorIndex = 1;

        const palette = document.getElementById("playful-palette");
        [1,2,3,4,5,6,7,8].forEach(num => {
            const btn = document.createElement("div");
            btn.style.width = "30px"; btn.style.height = "30px"; btn.style.backgroundColor = colorKey[num];
            btn.style.borderRadius = "50%"; btn.style.cursor = "pointer"; btn.style.border = "2px solid #fff";
            btn.innerText = num; btn.style.display="flex"; btn.style.alignItems="center"; btn.style.justifyContent="center";
            btn.onclick = () => selectedColorIndex = num;
            palette.appendChild(btn);
        });

        const grid = document.getElementById("playful-ocean-grid");
        gridMap.forEach((targetNum) => {
            const p = document.createElement("div");
            p.className = "cbn-pixel";
            p.innerText = targetNum;
            p.onclick = () => { if (selectedColorIndex === targetNum) { p.style.backgroundColor = colorKey[targetNum]; p.innerText = ""; } };
            grid.appendChild(p);
        });
    </script>
</body>
</html>
