<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marine Explorer</title>
    <style>
        body { background-color: #050a14; color: #e0f7fa; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; }
        .marine-section { background-color: #0b1d36; border: 2px solid #3498db; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: center; }
        h1, h2 { color: #5dade2; }

        /* SONAR: Centered Circle with Sweep & Trail */
        #sonar-circle { width: 200px; height: 200px; border: 4px solid #2ecc71; border-radius: 50%; margin: 20px auto; position: relative; background: #000; overflow: hidden; cursor: pointer; }
        #sonar-sweep { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; background: conic-gradient(from 0deg, rgba(46, 204, 113, 0.4) 0deg, transparent 60deg); animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* INTERACTIVE BUTTONS */
        .marine-btn { background: #1a3a5f; color: #fff; border: 2px solid #3498db; padding: 12px 24px; cursor: pointer; border-radius: 8px; font-weight: bold; margin: 5px; }
        
        /* 15x15 GRID */
        .marine-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 1px; max-width: 450px; margin: 20px auto; border: 2px solid #3498db; }
        .pixel { aspect-ratio: 1/1; background-color: #071526; border: 1px solid #1a3a5f; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #1a3a5f; }
        .palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .p-btn { width: 35px; height: 35px; border: 2px solid #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;">
        <h1>Marine Discovery 🌊</h1>

        <section class="marine-section">
            <h2>Sonar Explorer</h2>
            <div id="sonar-circle" onclick="ping()"><div id="sonar-sweep"></div></div>
            <p>Click the sonar to ping!</p>
        </section>

        <section class="marine-section">
            <h2>Deep Sea Trivia</h2>
            <div id="trivia-q" style="margin-bottom: 15px; font-size: 1.2rem;"></div>
            <div id="trivia-a"></div>
        </section>

        <section class="marine-section">
            <h2>Underwater Canvas</h2>
            <div id="marine-palette" class="palette"></div>
            <div id="marine-grid" class="marine-grid"></div>
        </section>

        <button class="marine-btn" style="display:block; margin: 20px auto;" onclick="window.location.href='index.html'">↩️ Return to Home</button>
    </div>

    <script>
        // SONAR: Audio Pulse
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        function ping() {
            const o = audio.createOscillator();
            const g = audio.createGain();
            o.frequency.value = 440;
            g.gain.setValueAtTime(0.5, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.5);
            o.connect(g); g.connect(audio.destination);
            o.start(); o.stop(audio.currentTime + 0.5);
        }
        setInterval(ping, 4000); // Auto-ping every 4s

        // TRIVIA: Functional
        const t = {q: "What is the 'Unicorn of the Sea'?", a: ["Narwhal", "Beluga"], c: 0};
        document.getElementById("trivia-q").innerText = t.q;
        t.a.forEach((opt, i) => {
            const b = document.createElement("button");
            b.className = "marine-btn"; b.innerText = opt;
            b.onclick = () => alert(i === t.c ? "Correct!" : "Try again");
            document.getElementById("trivia-a").appendChild(b);
        });

        // GRID: 15x15
        const colors = { 1: "#2980b9", 2: "#3498db", 3: "#5dade2", 4: "#aed6f1", 5: "#27ae60", 6: "#2ecc71", 7: "#abebc6", 8: "#f1c40f", 9: "#e67e22", 10: "#d35400", 11: "#f39c12", 12: "#ffffff" };
        let active = 1;
        const pal = document.getElementById("marine-palette");
        const grid = document.getElementById("marine-grid");

        Object.keys(colors).forEach(n => {
            const b = document.createElement("div");
            b.className = "p-btn"; b.style.backgroundColor = colors[n]; b.innerText = n;
            b.onclick = () => active = n;
            pal.appendChild(b);
        });

        for(let i=0; i<225; i++) {
            const p = document.createElement("div");
            p.className = "pixel"; p.innerText = (i % 12) + 1;
            p.onclick = () => { if(active == p.innerText) { p.style.backgroundColor = colors[active]; p.innerText = ""; } };
            grid.appendChild(p);
        }
    </script>
</body>
</html>
