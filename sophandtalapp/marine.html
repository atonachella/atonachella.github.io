<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marine Explorer</title>
    <style>
        body { background-color: #050a14; color: #e0f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .marine-section { background-color: #0b1d36; border: 2px solid #3498db; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2); }
        h1, h2 { color: #5dade2; text-align: center; text-transform: uppercase; letter-spacing: 2px; }

        /* SONAR CIRCLE - INTERACTIVE */
        #sonar-container { width: 200px; height: 200px; margin: 20px auto; border: 4px solid #3498db; border-radius: 50%; background: radial-gradient(circle, #050a14 0%, #000 100%); position: relative; overflow: hidden; cursor: pointer; }
        #sonar-sweep { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; background: conic-gradient(from 0deg, rgba(46, 204, 113, 0.3) 0deg, transparent 45deg); animation: radar-sweep 3s linear infinite; }
        @keyframes radar-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* TRIVIA BUTTONS */
        .trivia-btn { background: #1a3a5f; color: #fff; border: 2px solid #3498db; padding: 12px 24px; margin: 5px; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .trivia-btn:hover { background: #3498db; }

        /* 15x15 GRID */
        .marine-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 1px; max-width: 450px; margin: 20px auto; border: 2px solid #3498db; }
        .pixel { aspect-ratio: 1/1; background-color: #071526; border: 1px solid #1a3a5f; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #2980b9; }
        .palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .p-btn { width: 35px; height: 35px; border: 2px solid #fff; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* NAV BUTTON */
        .nav-btn { display: block; margin: 30px auto; background: #0b1d36; color: #3498db; border: 2px solid #3498db; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    </style>
</head>

        <h1>Marine Discovery 🌊</h1>

            <h2>Sonar Explorer</h2>

            </div>
        </section>

            <div id="marine-palette" class="palette"></div>
            <div id="marine-grid" class="marine-grid"></div>
        </section>

        <button class="nav-btn" onclick="window.location.href='index.html'">↩️ Return to Home</button>
    </div>

        function pulse() {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.value = 440;
            g.gain.setValueAtTime(0.5, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.5);
        }
